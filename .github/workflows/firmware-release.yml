name: Firmware Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-c3:
    runs-on: ubuntu-latest
    container: espressif/idf:v6.1
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate release version
        id: version
        shell: bash
        run: |
          version="$(tr -d '\r\n' < build_version.txt)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid build_version.txt: $version" >&2
            exit 1
          fi
          if [[ "$GITHUB_REF" == refs/tags/* && "${GITHUB_REF_NAME#v}" != "$version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match firmware version $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build ESP32-C3 firmware (ESP-IDF 6.1)
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          idf.py -B build_c3 -DIDF_TARGET=esp32c3 -DSMLEASY_IDF6_APP=1 \
            -DSDKCONFIG=build_c3/sdkconfig \
            "-DSDKCONFIG_DEFAULTS=sdkconfig.defaults;sdkconfig.defaults.c3_idf6" build

      - name: Prepare release asset
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p release
          cp build_c3/smartmeter.bin "release/SMLEasy-${VERSION}.bin"
          test -s "release/SMLEasy-${VERSION}.bin"

      - uses: actions/upload-artifact@v4
        with:
          name: firmware-c3
          path: release/*.bin

  build-s3:
    runs-on: ubuntu-latest
    needs: build-c3
    container: espressif/idf:v6.1
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build ESP32-S3 firmware (ESP-IDF 6.1)
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          idf.py set-target esp32s3
          idf.py build

      - name: Prepare release assets
        shell: bash
        env:
          VERSION: ${{ needs.build-c3.outputs.version }}
        run: |
          mkdir -p release
          cp build/smartmeter.bin "release/SMLEasy-S3-${VERSION}.bin"
          test -s "release/SMLEasy-S3-${VERSION}.bin"
          . "$IDF_PATH/export.sh"
          idf.py merge-bin -o "../release/SMLEasy-S3-${VERSION}-full.bin"

      - uses: actions/upload-artifact@v4
        with:
          name: firmware-s3
          path: release/*.bin

  publish:
    runs-on: ubuntu-latest
    needs: [build-c3, build-s3]
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.build-c3.outputs.version }}
          name: SMLEasy v${{ needs.build-c3.outputs.version }}
          generate_release_notes: true
          files: release/*.bin